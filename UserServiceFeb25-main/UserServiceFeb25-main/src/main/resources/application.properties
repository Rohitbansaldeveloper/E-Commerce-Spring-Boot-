spring.application.name=UserServiceFeb25
server.port=7070

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/userservicefeb25
spring.datasource.username=${POSTGRES_USER:userservicefeb25user}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT - override JWT_SECRET in production. Keep the same secret in the API Gateway.
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.issuer=${JWT_ISSUER:UserServiceFeb25}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

security.admin-email=${ADMIN_EMAIL:}

# Reliable Kafka producer settings
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.compression.type=snappy

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Shared service-to-service credential. Kubernetes injects the real value from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
