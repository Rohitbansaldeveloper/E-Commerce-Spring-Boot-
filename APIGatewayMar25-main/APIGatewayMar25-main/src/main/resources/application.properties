spring.application.name=APIGatewayMar25
server.port=8080

# ============================================================
# CLIENT -> API GATEWAY -> CLIENT-FACING SERVICES
# ============================================================
# The API Gateway exposes exactly these four business services.
# Internal services (Inventory, Payment, Email) are NOT routed
# through the Gateway.

# User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:7070}

# Product Service
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**
spring.cloud.gateway.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}

# Category endpoints are owned by Product Service; they do not create another gateway service.
spring.cloud.gateway.routes[2].id=category-product-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/categories/**
spring.cloud.gateway.routes[2].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}

# Cart Service
spring.cloud.gateway.routes[3].id=cart-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/cart/**
spring.cloud.gateway.routes[3].uri=${CART_SERVICE_URL:http://localhost:8085}

# Order Service
spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/orders/**
spring.cloud.gateway.routes[4].uri=${ORDER_SERVICE_URL:http://localhost:8083}

# JWT - must match User Service JWT_SECRET/JWT_ISSUER
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:UserServiceFeb25}

# Redis is used by the Gateway for JWT blacklist checks.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Stripe sends this server-to-server webhook without the application's JWT.
# Payment Service verifies the Stripe-Signature header itself.
spring.cloud.gateway.routes[5].id=stripe-webhook
spring.cloud.gateway.routes[5].predicates[0]=Path=/payments/webhook
spring.cloud.gateway.routes[5].uri=${PAYMENT_SERVICE_URL:http://localhost:8082}

# Shared service-to-service credential; Kubernetes injects it from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
