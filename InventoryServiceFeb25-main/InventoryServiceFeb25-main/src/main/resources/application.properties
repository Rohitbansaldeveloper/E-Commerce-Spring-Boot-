spring.application.name=InventoryServiceFeb25
server.port=8084

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/inventoryservicefeb25
spring.datasource.username=${POSTGRES_USER:inventoryserviceuser}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


inventory.cache.ttl-seconds=${INVENTORY_CACHE_TTL_SECONDS:300}

inventory.reservation.ttl-seconds=${INVENTORY_RESERVATION_TTL_SECONDS:900}
inventory.reservation.expiry-check-ms=${INVENTORY_RESERVATION_EXPIRY_CHECK_MS:30000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Shared service-to-service credential. Kubernetes injects the real value from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
