spring.application.name=ProductServiceFeb25
server.port=8081

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/productservicefeb25
spring.datasource.username=${POSTGRES_USER:productservicefeb25user}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

logging.level.org.springframework.web=INFO

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Shared service-to-service credential. Kubernetes injects the real value from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
