spring.application.name=EmailServiceFeb25
server.port=8181

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=emailService
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Reliable Kafka consumer settings
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.listener.concurrency=3
spring.kafka.consumer.properties.max.poll.records=20
spring.kafka.consumer.properties.session.timeout.ms=15000
spring.kafka.consumer.properties.heartbeat.interval.ms=5000

# Kafka topics use 3 partitions; the local Kubernetes deployment runs a single broker, so replication is 1.
kafka.topics.partitions=3
kafka.topics.replication-factor=1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Shared service-to-service credential. Kubernetes injects the real value from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
