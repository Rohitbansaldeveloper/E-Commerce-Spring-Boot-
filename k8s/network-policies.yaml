apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service-ingress
  namespace: ecommerce
spec:
  podSelector:
    matchLabels: {app: user-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
      ports: [{protocol: TCP, port: 7070}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-service-ingress
  namespace: ecommerce
spec:
  podSelector:
    matchLabels: {app: product-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
        - podSelector: {matchLabels: {app: cart-service}}
        - podSelector: {matchLabels: {app: order-service}}
      ports: [{protocol: TCP, port: 8081}]
---
