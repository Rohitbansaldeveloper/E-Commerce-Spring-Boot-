# PodDisruptionBudgets for stateless application services.
# These protect at least one replica during voluntary disruptions such as
# node drain/maintenance. They do not prevent involuntary failures.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
