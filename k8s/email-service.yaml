apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: ecommerce
spec:
  selector:
    app: email-service
  ports:
  - port: 8181
    targetPort: 8181
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
      - name: email-service
        image: __DOCKERHUB_NAMESPACE__/email-service:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8181
        env:
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: INTERNAL_SERVICE_TOKEN
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: MAIL_USERNAME
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: MAIL_PASSWORD
        - name: MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: MAIL_FROM
        readinessProbe:
          tcpSocket:
            port: 8181
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8181
          initialDelaySeconds: 40
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
