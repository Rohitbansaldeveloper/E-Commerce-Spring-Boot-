spring.application.name=CartServiceFeb25
server.port=8085

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/cartservicefeb25?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${POSTGRES_USER:cartserviceuser}
spring.datasource.password=${POSTGRES_PASSWORD:cartservicepass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Internal service URLs. In Kubernetes these resolve through Kubernetes Service DNS.
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}


# Shared service-to-service credential. Kubernetes injects the real value from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
