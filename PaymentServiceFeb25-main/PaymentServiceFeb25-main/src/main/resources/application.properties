spring.application.name=PaymentServiceFeb25
server.port=8082

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/paymentservicefeb25?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${POSTGRES_USER:paymentserviceuser}
spring.datasource.password=${POSTGRES_PASSWORD:paymentservicepass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

stripe.key=${STRIPE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payment.currency=${PAYMENT_CURRENCY:INR}
payment.success-url=${PAYMENT_SUCCESS_URL:http://ecommerce.local/payment/success}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reliable Kafka producer settings
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.compression.type=snappy

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Transactional outbox publisher
kafka.outbox.publish-interval-ms=${KAFKA_OUTBOX_PUBLISH_INTERVAL_MS:5000}

# Shared service-to-service credential. Kubernetes injects the real value from a Secret.
internal.service.token=${INTERNAL_SERVICE_TOKEN:CHANGE_ME_INTERNAL_SERVICE_TOKEN_32_CHARS}
